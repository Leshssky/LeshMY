<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeshMY — AI</title>
<style>
:root{
  --bg:#090b11; --text:#f5f6fa; --muted:#9ca1ad; --panel:#1d1f24;
  --border:#30333c; --accent:#6376ff; --accent2:#3048ff;
}
body.light{
  --bg:#f7f8fb; --text:#17181d; --muted:#666b76; --panel:#fff;
  --border:#e0e2e8; --accent:#5368ff; --accent2:#7585ff;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif}
body{
  overflow:hidden;background:var(--bg);color:var(--text);
  transition:background .3s,color .3s;
}
body::before{
  content:"";position:fixed;z-index:-1;inset:-30%;
  background:
    radial-gradient(ellipse at 50% 42%,rgba(49,77,255,.55),transparent 38%),
    radial-gradient(circle at 78% 12%,rgba(101,76,255,.20),transparent 28%);
  filter:blur(35px);
  animation:ambient 8s ease-in-out infinite alternate;
}
body.light::before{
  background:
    radial-gradient(ellipse at 50% 42%,rgba(84,111,255,.25),transparent 40%),
    radial-gradient(circle at 78% 12%,rgba(145,110,255,.12),transparent 28%);
}
@keyframes ambient{
  from{transform:scale(1);opacity:.75}
  to{transform:scale(1.09);opacity:1}
}

.app{height:100vh;display:flex;flex-direction:column}
header{
  height:64px;display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;border-bottom:1px solid var(--border);
  background:rgba(9,11,17,.35);backdrop-filter:blur(15px)
}
body.light header{background:rgba(255,255,255,.55)}
.logo{font-size:21px;font-weight:800}
.settings-btn{
  border:1px solid var(--border);background:var(--panel);color:var(--text);
  padding:9px 13px;border-radius:10px;cursor:pointer
}

main{flex:1;overflow-y:auto;padding:30px 15px 130px}
.container{max-width:820px;margin:auto}
.welcome{
  min-height:60vh;display:flex;align-items:center;justify-content:center;
  text-align:center
}
.logo-icon{
  width:70px;height:70px;margin:auto auto 20px;border-radius:22px;
  display:grid;place-items:center;color:#fff;font-size:32px;font-weight:800;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 0 55px rgba(70,90,255,.48)
}
h1{font-size:42px;margin:0 0 10px}
.welcome p{margin:0;color:var(--muted);font-size:16px}

.messages{display:flex;flex-direction:column;gap:13px}
.message{display:flex;animation:messageIn .3s ease both}
.message.user{justify-content:flex-end}
.bubble{
  max-width:76%;padding:12px 16px;border-radius:17px;
  line-height:1.5;white-space:pre-wrap
}
.bot .bubble{background:var(--panel);border:1px solid var(--border)}
.user .bubble{
  color:white;background:linear-gradient(135deg,var(--accent),var(--accent2))
}
@keyframes messageIn{
  from{opacity:0;transform:translateY(12px) scale(.98)}
  to{opacity:1;transform:none}
}

.composer{
  position:fixed;left:0;right:0;bottom:0;padding:15px 15px 20px;
  background:linear-gradient(transparent,var(--bg) 30%)
}
.input-wrap{
  max-width:820px;margin:auto;display:flex;align-items:center;gap:8px;
  padding:8px;background:var(--panel);border:1px solid var(--border);
  border-radius:18px;box-shadow:0 12px 45px rgba(0,0,0,.18)
}
input{
  flex:1;border:0;outline:0;background:transparent;color:var(--text);
  font-size:16px;padding:11px
}
.send{
  width:44px;height:44px;border:0;border-radius:13px;
  background:var(--accent);color:#fff;font-size:20px;cursor:pointer;
  transition:.15s
}
.send:hover{transform:translateY(-1px) scale(1.04)}
.send:active{transform:scale(.93)}

.settings{
  position:fixed;right:20px;top:74px;width:230px;padding:16px;
  background:var(--panel);border:1px solid var(--border);border-radius:15px;
  box-shadow:0 15px 50px rgba(0,0,0,.3);display:none;z-index:10
}
.settings.open{display:block;animation:pop .2s ease}
@keyframes pop{
  from{opacity:0;transform:translateY(-5px) scale(.97)}
  to{opacity:1;transform:none}
}
.settings h3{margin:0 0 12px}
.theme{
  width:100%;padding:10px;margin-top:7px;border-radius:9px;
  border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer
}
.typing{display:flex;gap:5px;padding:15px 17px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bounce 1s infinite}
.dot:nth-child(2){animation-delay:.15s}
.dot:nth-child(3){animation-delay:.3s}
@keyframes bounce{
  0%,70%,100%{transform:translateY(0);opacity:.4}
  35%{transform:translateY(-5px);opacity:1}
}
@media(max-width:600px){
  h1{font-size:32px}
  .bubble{max-width:88%}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo">LeshMY</div>
  <button class="settings-btn" onclick="toggleSettings()">⚙ Настройки</button>
</header>

<div class="settings" id="settings">
  <h3>Настройки</h3>
  <div>Тема интерфейса:</div>
  <button class="theme" onclick="setTheme('light')">☀ Белая</button>
  <button class="theme" onclick="setTheme('dark')">🌙 Чёрная</button>
</div>

<main id="main">
  <div class="container">
    <section class="welcome" id="welcome">
      <div>
        <div class="logo-icon">✦</div>
        <h1>LeshMY</h1>
        <p>Твой личный ИИ-помощник</p>
      </div>
    </section>
    <div class="messages" id="messages"></div>
  </div>
</main>

<div class="composer">
  <div class="input-wrap">
    <input id="input" placeholder="Спросить LeshMY" autocomplete="off">
    <button class="send" onclick="sendMessage()">↑</button>
  </div>
</div>
</div>

<script>
const input=document.getElementById("input");
const messages=document.getElementById("messages");
const welcome=document.getElementById("welcome");
const main=document.getElementById("main");

function toggleSettings(){
  document.getElementById("settings").classList.toggle("open");
}
function setTheme(theme){
  document.body.classList.toggle("light",theme==="light");
  localStorage.setItem("leshmy-theme",theme);
}
setTheme(localStorage.getItem("leshmy-theme") || "dark");

function addMessage(text,type){
  const row=document.createElement("div");
  row.className="message "+type;
  const bubble=document.createElement("div");
  bubble.className="bubble";
  bubble.textContent=text;
  row.appendChild(bubble);
  messages.appendChild(row);
  main.scrollTop=main.scrollHeight;
}

function showTyping(){
  const row=document.createElement("div");
  row.id="typing";
  row.className="message bot";
  row.innerHTML='<div class="bubble typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
  messages.appendChild(row);
  main.scrollTop=main.scrollHeight;
}
function removeTyping(){
  const el=document.getElementById("typing");
  if(el) el.remove();
}

function sendMessage(){
  const text=input.value.trim();
  if(!text)return;
  welcome.style.display="none";
  addMessage(text,"user");
  input.value="";
  showTyping();

  // Пока это демонстрационный ответ.
  // Настоящий ИИ подключим через безопасный сервер/API.
  setTimeout(()=>{
    removeTyping();
    addMessage("Принял сообщение! 🤖\\nСейчас LeshMY работает в демо-режиме. Настоящий ИИ подключается через сервер, чтобы секретный API-ключ не попал к посетителям.","bot");
  },900);
}

input.addEventListener("keydown",e=>{
  if(e.key==="Enter") sendMessage();
});
</script>
</body>
</html>
