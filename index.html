<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LeshMY</title>
<style>
:root{--bg:#080b14;--panel:#151b2d;--text:#f4f7ff;--muted:#9aa8c0;--accent:#286fff;--assistant:#1b2438;--border:#ffffff18}
*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}body.light{--bg:#f4f6fb;--panel:#fff;--text:#172033;--muted:#65718a;--assistant:#edf1f8;--border:#00000018}
body:before{content:"";position:fixed;z-index:-1;width:360px;height:360px;left:8%;top:5%;background:#397aff30;filter:blur(65px);border-radius:50%;animation:float 9s infinite}@keyframes float{50%{transform:translate(25px,-20px) scale(1.1)}}
button,input,select{font:inherit}button{cursor:pointer;transition:transform .16s,background .2s}button:hover{transform:scale(1.05)}button:active{transform:scale(.9)}@media(hover:none){button:hover{transform:none}button:active{transform:scale(.92)}}
header{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--border);background:var(--panel)}.logo{display:flex;align-items:center;gap:9px;font-weight:850}.mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#9b5cff);box-shadow:0 0 22px #3984ff55}.modes{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:12px}.modes button{background:transparent;color:var(--muted);border:0;border-radius:9px;padding:8px;font-size:12px}.modes .active{background:var(--accent);color:white}
.chat{height:calc(100vh - 66px);overflow:auto;padding:30px 16px 140px}.inner{max-width:850px;margin:auto}.hero{text-align:center;padding:45px 5px 28px}.hero .star{font-size:38px;animation:twinkle 3s infinite}.hero h1{font-size:44px;margin:8px 0}.hero p{color:var(--muted);margin:0}@keyframes twinkle{50%{transform:rotate(12deg) scale(1.1)}}.quick{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:20px}.quick button,.setting-btn{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:9px 12px;color:var(--muted)}
.messages{display:flex;flex-direction:column;gap:12px}.msg{max-width:82%;padding:13px 16px;border-radius:18px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;animation:appear .25s}.user{align-self:flex-end;background:var(--accent);color:white;border-bottom-right-radius:6px}.ai{align-self:flex-start;background:var(--assistant);border:1px solid var(--border);border-bottom-left-radius:6px}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.typing{display:flex;gap:5px;padding:4px}.typing i{width:6px;height:6px;background:var(--muted);border-radius:50%;animation:dot .8s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes dot{50%{transform:translateY(-4px);opacity:.4}}
.composer-wrap{position:fixed;bottom:0;left:0;right:0;padding:14px 14px 17px;background:linear-gradient(transparent,var(--bg) 40%)}.composer{max-width:850px;margin:auto;display:flex;gap:8px;padding:8px;border:1px solid var(--border);border-radius:18px;background:var(--panel)}.composer input{flex:1;min-width:0;background:transparent;color:var(--text);border:0;outline:0;padding:10px}.send{width:44px;border:0;border-radius:13px;background:var(--accent);color:white}.launch{position:fixed;left:15px;bottom:15px;width:46px;height:46px;border-radius:15px;background:var(--panel);border:1px solid var(--border);color:var(--text);z-index:5;font-size:20px}.settings{position:fixed;left:15px;bottom:70px;width:min(350px,calc(100vw - 30px));max-height:calc(100vh - 95px);overflow:auto;padding:14px;border:1px solid var(--border);border-radius:19px;background:var(--panel);box-shadow:0 20px 60px #0006;z-index:4;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}.settings.open{opacity:1;transform:none;pointer-events:auto}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 4px}.name{font-size:14px}.sub{font-size:11px;color:var(--muted);margin-top:3px}.setting-btn,select{color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:8px;max-width:160px}.divider{height:1px;background:var(--border);margin:4px 0}.colors{display:flex;gap:8px;flex-wrap:wrap;padding:7px}.color{width:28px;height:28px;border-radius:50%;border:2px solid transparent}.color.selected{border-color:var(--text);box-shadow:0 0 0 2px var(--panel)}.games{display:grid;gap:7px}.game-card{width:100%;text-align:left;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:10px;color:var(--text)}.game-card strong{display:block;font-size:13px}.game-card span{display:block;font-size:11px;color:var(--muted);margin-top:3px}.game-area{margin-top:8px;padding:12px;text-align:center;border:1px solid var(--border);border-radius:12px;background:var(--bg)}.game-area[hidden]{display:none}.target{display:block;width:40px;height:40px;border:0;border-radius:50%;background:var(--accent);margin:12px auto;box-shadow:0 0 16px var(--accent)}.toggle{accent-color:var(--accent)}@media(max-width:500px){header{padding:0 10px}.modes button{padding:7px}.chat{padding-top:10px}.msg{max-width:92%}}
</style></head><body>
<header><div class="logo"><div class="mark">✦</div>LeshMY</div><div class="modes"><button id="fast" class="active">⚡ Быстрый</button><button id="smart">🧠 Умный</button></div></header>
<main class="chat" id="chat"><div class="inner"><section class="hero" id="hero"><div class="star">✦</div><h1>LeshMY</h1><p id="subtitle">Твой личный ИИ-помощник</p><div class="quick"><button data-q="Что ты умеешь?">Что ты умеешь?</button><button data-q="Помоги придумать идею">Помоги с идеей</button><button data-q="Объясни простыми словами">Объясни проще</button></div></section><div class="messages" id="messages"></div></div></main>
<div class="composer-wrap"><form class="composer" id="form"><input id="input" placeholder="Напиши сообщение..." autocomplete="off"><button class="send" type="submit">➤</button></form></div>
<button class="launch" id="launch">⚙</button><section class="settings" id="settings"><h3 id="stitle">Настройки</h3>
<div class="row"><div><div class="name" id="appearance">Внешний вид</div><div class="sub" id="themeLabel">Чёрный</div></div><div><button class="setting-btn" id="dark">Чёрный</button> <button class="setting-btn" id="light">Белый</button></div></div><div class="divider"></div>
<div class="row"><div><div class="name" id="languageLabel">Язык</div><div class="sub">Язык интерфейса</div></div><select id="language"><option value="ru">Русский</option><option value="en">English</option><option value="kk">Қазақша</option><option value="uk">Українська</option><option value="tr">Türkçe</option><option value="es">Español</option></select></div><div class="divider"></div>
<div class="row"><div><div class="name" id="colorLabel">Цвет</div><div class="sub">Кнопки и сообщения</div></div></div><div class="colors"><button class="color selected" data-c="#286fff" style="background:#286fff"></button><button class="color" data-c="#18a9f5" style="background:#18a9f5"></button><button class="color" data-c="#8b5cf6" style="background:#8b5cf6"></button><button class="color" data-c="#ef4444" style="background:#ef4444"></button><button class="color" data-c="#16a34a" style="background:#16a34a"></button><button class="color" data-c="#f59e0b" style="background:#f59e0b"></button><button class="color" data-c="#ec4899" style="background:#ec4899"></button></div><div class="divider"></div>
<div class="row"><div><div class="name" id="gameLabel">Мини-игра при ожидании</div><div class="sub">Можно отключить здесь</div></div><input class="toggle" type="checkbox" id="gameOn" checked></div><div class="row"><div class="name">Выбор мини-игры</div></div>
<div class="games"><button class="game-card" data-game="catch"><strong>🎯 Поймай точку</strong><span>Нажимай на светящийся кружок и набирай очки за 10 секунд.</span></button><button class="game-card" data-game="reaction"><strong>⚡ Проверка реакции</strong><span>Дождись зелёного сигнала и нажми кнопку.</span></button><button class="game-card" data-game="memory"><strong>🧠 Запомни последовательность</strong><span>Повтори порядок цветных плиток.</span></button></div><div class="game-area" id="gameArea" hidden></div><p class="sub">Настройки сохраняются в этом браузере. ИИ пока не подключён.</p></section>
<script>
const $=s=>document.querySelector(s),root=document.documentElement,body=document.body;let mode='fast',waiting=false,game='catch',timer;
function theme(t){body.classList.toggle('light',t==='light');$('#themeLabel').textContent=t==='light'?'Белый':'Чёрный';localStorage.setItem('leshTheme',t)}$('#dark').onclick=()=>theme('dark');$('#light').onclick=()=>theme('light');theme(localStorage.getItem('leshTheme')||'dark');
function color(c){root.style.setProperty('--accent',c);document.querySelectorAll('.color').forEach(b=>b.classList.toggle('selected',b.dataset.c===c));localStorage.setItem('leshColor',c)}document.querySelectorAll('.color').forEach(b=>b.onclick=()=>color(b.dataset.c));color(localStorage.getItem('leshColor')||'#286fff');
const langs={ru:['Напиши сообщение...','Твой личный ИИ-помощник','Настройки','Внешний вид','Язык','Цвет','Мини-игра при ожидании'],en:['Write a message...','Your personal AI assistant','Settings','Appearance','Language','Color','Waiting mini-game'],kk:['Хабарлама жаз...','Жеке AI көмекшің','Баптаулар','Сыртқы көрініс','Тіл','Түс','Күту ойыны'],uk:['Напиши повідомлення...','Твій особистий AI-помічник','Налаштування','Вигляд','Мова','Колір','Мінігра під час очікування'],tr:['Bir mesaj yaz...','Kişisel AI asistanın','Ayarlar','Görünüm','Dil','Renk','Bekleme mini oyunu'],es:['Escribe un mensaje...','Tu asistente de IA','Ajustes','Apariencia','Idioma','Color','Minijuego de espera']};
function setLang(l){let t=langs[l]||langs.ru;$('#input').placeholder=t[0];$('#subtitle').textContent=t[1];$('#stitle').textContent=t[2];$('#appearance').textContent=t[3];$('#languageLabel').textContent=t[4];$('#colorLabel').textContent=t[5];$('#gameLabel').textContent=t[6];document.documentElement.lang=l}$('#language').value=localStorage.getItem('leshLang')||'ru';setLang($('#language').value);$('#language').onchange=e=>{localStorage.setItem('leshLang',e.target.value);setLang(e.target.value)};
$('#launch').onclick=()=>$('#settings').classList.toggle('open');document.addEventListener('click',e=>{if(!$('#settings').contains(e.target)&&e.target!==$('#launch'))$('#settings').classList.remove('open')});
function setMode(m){mode=m;$('#fast').classList.toggle('active',m==='fast');$('#smart').classList.toggle('active',m==='smart')}$('#fast').onclick=()=>setMode('fast');$('#smart').onclick=()=>setMode('smart');
function add(t,c){$('#hero').style.display='none';let d=document.createElement('div');d.className='msg '+c;d.textContent=t;$('#messages').appendChild(d);$('#chat').scrollTop=$('#chat').scrollHeight;return d}
function stopGame(){clearTimeout(timer);$('#gameArea').hidden=true;$('#gameArea').innerHTML=''}
function startGame(){stopGame();if(!$('#gameOn').checked)return;let a=$('#gameArea');a.hidden=false;
if(game==='catch'){let score=0,left=10;a.innerHTML='<b>🎯 Поймай точку</b><p class="sub">Осталось <b id="left">10</b> сек. Очки: <b id="score">0</b></p><button class="target" id="target"></button>';$('#target').onclick=()=>{score++;$('#score').textContent=score;$('#target').style.marginLeft=Math.random()*65+'%'};let tick=()=>{left--;if($('#left'))$('#left').textContent=left;if(left<=0){a.innerHTML='<b>Раунд окончен!</b><p>Очки: '+score+'</p>'}else timer=setTimeout(tick,1000)};timer=setTimeout(tick,1000)}
if(game==='reaction'){a.innerHTML='<b>⚡ Проверка реакции</b><p id="rt">Нажми старт и дождись зелёного сигнала.</p><button class="setting-btn" id="rs">Старт</button>';$('#rs').onclick=()=>{let b=$('#rs');b.disabled=true;$('#rt').textContent='Жди...';timer=setTimeout(()=>{let start=Date.now();b.disabled=false;b.textContent='ЖМИ!';b.style.background='#16a34a';b.onclick=()=>{$('#rt').textContent='Реакция: '+(Date.now()-start)+' мс';b.textContent='Снова';b.style.background='';b.onclick=startGame}},1000+Math.random()*2500)}}
if(game==='memory'){let seq=[],pos=0,cols=['#286fff','#ef4444','#16a34a','#f59e0b'];a.innerHTML='<b>🧠 Запомни последовательность</b><p id="mt">Нажми «Начать».</p><div id="tiles" style="display:flex;gap:8px;justify-content:center;margin:10px"></div><button class="setting-btn" id="ms">Начать</button>';cols.forEach((c,i)=>{let b=document.createElement('button');b.style.cssText='width:40px;height:40px;border:0;border-radius:10px;background:'+c;b.onclick=()=>{if(!seq.length)return;if(i!==seq[pos]){seq=[];$('#mt').textContent='Ошибка! Начни снова.';return}pos++;if(pos===seq.length){seq.push(Math.floor(Math.random()*4));pos=0;$('#mt').textContent='Отлично! Новый уровень: '+seq.length;flash()}};$('#tiles').appendChild(b)});function flash(){let i=0;$('#mt').textContent='Запомни цвета';function f(){if(i>=seq.length){$('#mt').textContent='Повтори порядок';return}let b=$('#tiles').children[seq[i++]];b.style.filter='brightness(1.8)';setTimeout(()=>{b.style.filter='';setTimeout(f,160)},300)}f()}$('#ms').onclick=()=>{seq=[Math.floor(Math.random()*4),Math.floor(Math.random()*4)];pos=0;flash()}}
}
document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>{game=b.dataset.game;if(waiting)startGame();else{let a=$('#gameArea');a.hidden=false;a.innerHTML='<b>Выбрано: '+b.querySelector('strong').textContent+'</b><p class="sub">Игра запустится во время ожидания ответа.</p>'}});
$('#gameOn').checked=localStorage.getItem('leshGame')!=='off';$('#gameOn').onchange=e=>{localStorage.setItem('leshGame',e.target.checked?'on':'off');if(!e.target.checked)stopGame()};
async function send(text){text=text.trim();if(!text||waiting)return;add(text,'user');$('#input').value='';waiting=true;let m=add('','ai');m.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';startGame();await new Promise(r=>setTimeout(r,1700));stopGame();m.textContent=mode==='fast'?'Быстрый режим выбран. Это пока демо: для настоящих ответов нужен серверный ИИ.':'Умный режим выбран. Это пока демо: подключи более мощную модель через сервер.';waiting=false}
$('#form').onsubmit=e=>{e.preventDefault();send($('#input').value)};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>send(b.dataset.q));
</script></body></html>
